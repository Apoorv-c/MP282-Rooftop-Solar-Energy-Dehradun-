apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp282-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp282-api
  template:
    metadata:
      labels:
        app: mp282-api
    spec:
      containers:
        - name: mp282-api
          image: mp282-api:1.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mp282-svc
spec:
  selector:
    app: mp282-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
